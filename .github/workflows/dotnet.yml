name: .NET

on:
  push:
    branches: [ main,  develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  publish:
    # Lauffähige Pakete für Windows-PC und Raspberry Pi (64-bit Raspberry Pi OS)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ win-x64, linux-x64, linux-arm64 ]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish
      run: dotnet publish WebRaid.UI/WebRaid.UI.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/${{ matrix.rid }}
    - uses: actions/upload-artifact@v4
      with:
        name: WebRaid-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}
